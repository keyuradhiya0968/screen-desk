name: Daily screen run

on:
  schedule:
    - cron: "0 2 * * 1-6"    # 07:30 IST, Monday-Saturday
    - cron: "30 12 * * 1-5"  # 18:00 IST, Monday-Friday
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screen-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run screens
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m screener.run
      - name: Save results
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "Screen run $(date -u +%F_%H%M)"
          git push
