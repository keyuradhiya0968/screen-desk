name: Daily screen run

on:
  schedule:
    - cron: "30 2-16/2 * * *"   # every 2 hours, 08:00 to 22:00 IST (NSE feeds only hold recent filings)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screen-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run screens
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m screener.run
      - name: Save results
        run: |
          git config user.name "screen-bot"
          git config user.email "screen-bot@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "Screen run $(date -u +%F_%H%M)"
          git pull --rebase
          git push
